name: Test

on:
  push:
    paths-ignore:
      - 'images/map/**'
  pull_request:
    paths-ignore:
      - 'images/map/**'
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -e . --group dev
      - name: Lint
        run: scripts/lint-check
      - name: Type check
        run: scripts/type-check
      - name: Run tests
        run: scripts/test --cov --cov-report=json:coverage.json
      - name: Check coverage
        run: python tests/check_coverage.py
