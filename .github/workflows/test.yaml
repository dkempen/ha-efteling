name: Test

on:
  push:
    paths-ignore:
      - "images/map/**"
  pull_request:
    paths-ignore:
      - "images/map/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e . --group dev
      - name: Lint
        run: scripts/lint-check
      - name: Type check
        run: scripts/type-check
      - name: Run tests
        run: scripts/test --cov --cov-report=json:coverage.json
      - name: Check coverage
        run: python scripts/check_coverage.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify typing marker in wheel
        run: |
          wheel=$(find dist -name "*.whl" -print -quit)
          unzip -l "$wheel" | grep -q "efteling_park/py.typed"

  minimum-version:
    name: Minimum version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install integration
        run: python -m pip install --no-deps -e .
      - name: Install test dependencies
        run: python -m pip install --group minimum-test
      - name: Run tests
        run: python -m pytest
