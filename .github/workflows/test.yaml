name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Lint
        run: scripts/lint-check
      - name: Run tests
        run: scripts/test --cov --cov-report=json:coverage.json
      - name: Check coverage
        run: python tests/check_coverage.py
