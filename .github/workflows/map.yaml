name: Update park map

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/map.yaml
      - scripts/update_map.py
      - pyproject.toml
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: update-park-map
  cancel-in-progress: false

jobs:
  update-park-map:
    name: Update park map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MAP_UPDATE_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install --group map
      - name: Generate park maps
        run: python scripts/update_map.py
      - name: Commit map changes
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git add images/map/
          git diff --cached --quiet && exit 0

          git commit -m "Update park map"
          git push
