name: Update park map

on:
  push:
    branches:
      - master
    paths:
      - scripts/update_map.py
      - .github/workflows/map.yaml
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"
      timezone: Europe/Amsterdam

permissions:
  contents: write

jobs:
  update-map:
    name: Generate and commit park maps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MAP_UPDATE_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install pillow
      - name: Generate park maps
        run: python scripts/update_map.py
      - name: Commit map changes
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"

          git add images/map/
          git diff --cached --quiet && exit 0

          git commit -m "Update park map"
          git push
