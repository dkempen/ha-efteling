name: Validate

on:
  push:
    paths-ignore:
      - "images/map/**"
  pull_request:
    paths-ignore:
      - "images/map/**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main # Keep unpinned to automatically detect breaking changes.
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Hassfest
        uses: home-assistant/actions/hassfest@master # Keep unpinned to automatically detect breaking changes.
