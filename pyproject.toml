[project]
name = "ha-efteling"
version = "0.6.0"
description = "Home Assistant integration for Efteling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["homeassistant>=2024.11.0"]

[dependency-groups]
test = [
    "pytest-homeassistant==2026.11.0",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "test" },
    "ruff==0.17.1",
    "mypy==2.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_components/efteling_park"]

[tool.mypy]
python_version = "3.14"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN401", "D203", "D212", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
addopts = "-p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
testpaths = ["tests"]
